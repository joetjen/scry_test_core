name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test

jobs:
  ci:
    name: OTP 28 / Elixir 1.19.4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout scry_core (path dependency)
        run: git clone --depth 1 https://github.com/joetjen/scry_core.git ../scry_core

      - name: Checkout scry_engine_inmemory (path dependency)
        run: git clone --depth 1 https://github.com/joetjen/scry_engine_inmemory.git ../scry_engine_inmemory

      - name: Checkout scry_engine_ets (path dependency)
        run: git clone --depth 1 https://github.com/joetjen/scry_engine_ets.git ../scry_engine_ets

      - name: Checkout scry_engine_exqlite (path dependency)
        run: git clone --depth 1 https://github.com/joetjen/scry_engine_exqlite.git ../scry_engine_exqlite

      - name: Checkout scry_engine_postgrex (path dependency)
        run: git clone --depth 1 https://github.com/joetjen/scry_engine_postgrex.git ../scry_engine_postgrex

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.2"
          elixir-version: "1.19.4-otp-28"

      - name: Restore deps/_build cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Precommit
        run: mix precommit
